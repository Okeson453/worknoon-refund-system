# WORKNOON refund system — one command brings up PostgreSQL, the API and the web client.
#   cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16
    container_name: worknoon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worknoon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d worknoon']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - '5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: worknoon-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/worknoon}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\'http://127.0.0.1:8080/api/health\').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: worknoon-web
    restart: unless-stopped
    environment:
      # nginx resolves this at request time and builds the /api upstream from it. It must be the
      # compose service name, not the image default (api.railway.internal), or every /api call
      # 502s locally while the SPA still serves — the confusing "health endpoint unreachable on a
      # machine where everything is clearly running" failure.
      API_INTERNAL_HOST: api
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-3000}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
