# Serves the built SPA and reverse-proxies /api to the Express service, so the browser only ever
# talks to one origin and there is no CORS surface.
#
# This file is processed as an envsubst template by the nginx image entrypoint (see Dockerfile):
# API_INTERNAL_HOST is expanded at container start, everything else ($host etc.) is a live nginx
# variable and is left alone.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. The API is same-origin, so connect-src stays tight.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Defer upstream DNS to request time: if the hostname doesn't resolve, /api returns a
        # 502 but the SPA still serves, instead of nginx refusing to boot. NGINX_LOCAL_RESOLVERS
        # is exported by the nginx image entrypoint (15-local-resolvers.envsh) from the
        # container's /etc/resolv.conf, so we use the platform's own DNS.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
        set $api_upstream "http://${API_INTERNAL_HOST}:4000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
